name: Simulator smoke test
on:
  push:
    branches: ["smoke/**"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: List Xcodes and Duo simulators
        run: |
          echo "::notice::${{ matrix.os }} Xcodes: $(ls /Applications | grep -i xcode | tr '\n' ' ')"
          for x in $(ls -d /Applications/Xcode_27* /Applications/Xcode-27* 2>/dev/null | sort -V | tail -1); do
            sudo xcode-select -s "$x"
            echo "::notice::${{ matrix.os }} selected $(xcodebuild -version | tr '\n' ' ')"
            echo "::notice::${{ matrix.os }} SDKs: $(xcodebuild -showsdks | grep -i ios | tr '\n' ' ' | tr -s ' ')"
            echo "::notice::${{ matrix.os }} device types: $(xcrun simctl list devicetypes | grep -i -E 'duo|fold' | tr '\n' ';')"
            echo "::notice::${{ matrix.os }} runtimes: $(xcrun simctl list runtimes | grep -i ios | tr '\n' ';')"
            echo "::notice::${{ matrix.os }} duo devices: $(xcrun simctl list devices | grep -i duo | head -3 | tr '\n' ';')"
            xcrun simctl help 2>&1 | grep -i -E "fold|hinge|pose|display" | head -5 | sed 's/^/::notice::simctl: /'
          done
