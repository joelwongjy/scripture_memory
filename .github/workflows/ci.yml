name: CI

on:
  push:
  pull_request:

jobs:
  srs-core-tests:
    name: SRS core unit tests
    runs-on: ubuntu-latest
    # Official Swift image — gives us `swift test` on a plain Linux runner,
    # no Xcode/simulator needed (the tested files are pure Foundation).
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test

  ios-build:
    name: iOS app build
    runs-on: macos-15
    # Compiles the app and widget for the simulator, unsigned. Catches anything
    # the Linux test job can't see (SwiftUI, WidgetKit, the Xcode project).
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        # The app icon is an Icon Composer `.icon`, which Xcode 16 can't compile.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Xcode version
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: Build
        run: |
          xcodebuild build \
            -project "Scripture Memory.xcodeproj" \
            -scheme "Scripture Memory" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 && status=0 || status=$?
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u || true
          # Surface compiler errors as annotations on the run.
          grep -E "^/.+:[0-9]+:[0-9]+: error: " build.log | sort -u | head -50 \
            | sed -E "s#^$PWD/##; s#^([^:]+):([0-9]+):[0-9]+: error: (.*)#::error file=\1,line=\2::\3#" || true
          grep -E "error:" build.log | grep -vE "^/.+:[0-9]+:[0-9]+: error: " | sort -u | head -20 | sed -E "s#^ *#::error::#" || true
          [ $status -eq 0 ] || tail -15 build.log | sed -E "s#^ *#::warning::#"
          exit $status

  app-size:
    name: App size (Release, device)
    runs-on: macos-15
    # Reports the size of an unsigned Release build for a real device, as a
    # notice on the run. Informational only.
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build
        run: |
          xcodebuild build \
            -project "Scripture Memory.xcodeproj" \
            -scheme "Scripture Memory" \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { tail -20 build.log; exit 1; }
      - name: Report size
        run: |
          app="build/Build/Products/Release-iphoneos/Scripture Memory.app"
          echo "::notice::App bundle: $(du -sh "$app" | cut -f1)"
          echo "::notice::Breakdown: $(du -sh "$app"/* "$app"/PlugIns/* 2>/dev/null | sort -rh | head -8 | tr '\t' ' ' | sed "s#$app/##" | tr '\n' ';')"
          zip -qr app.zip "$app" && echo "::notice::Zipped (rough download size): $(du -sh app.zip | cut -f1)"
